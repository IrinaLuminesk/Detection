GPUS: (0,1,2,3)
WORKERS: 4
PRINT_FREQ: 1

DATASET:
  TRAIN_IMAGE_FOLDER: "/content/filtered_dataset/train/images"
  TRAIN_LABEL_FOLDER: "/content/filtered_dataset/train/labels"
  TEST_IMAGE_FOLDER: "/content/filtered_dataset/val/images"
  TEST_LABEL_FOLDER: "/content/filtered_dataset/val/labels",
  NUM_CLASSES: 90 #Chưa bao gồm background 
  ORIGINAL_FORMAT: "coco"
  CONVERT_FORMAT: "xyxy"

TRAIN:
  DATA:
    BATCH_SIZE: 4
  TRAIN_PARA:
    MODEL_TYPE: 1 #{1: Resnet50, 2: Xception}
    BEGIN_EPOCH: 0
    END_EPOCH: 50
    LAST_EPOCH: 0
    OPTIMIZER: "AdamW"
    RESUME: False
    EARLY_STOPPING: TRUE
    PATIENCE: 10
    RELU_REPLACE: TRUE

  OPTIONAL:
    SAVE_CHECKPOINT: TRUE
    CHECKPOINT_PATH: "./resume_model/checkpoint.pth"
    SAVE_BEST: TRUE
    BEST_PATH: "./best_model/best_checkpoint.pth"
    SAVE_METRICS: TRUE
    METRICS_PATH: "./metrics/metrics.csv"
  LEARNING_RATE:
    PieceWise:
      START_LR: 0.0001
      MAX_LR: 0.0005
      MIN_LR: 0.0001
      RAMPUP_EPOCHS: 10
      SUSTAIN_EPOCHS: 5
      EXP_DECAY: 0.8
    WarmupCosine: 
      START_LR: 0.00001
      MAX_LR: 0.00005
      MIN_LR: 0.00003
      RAMPUP_EPOCHS: 5
      SUSTAIN_EPOCHS: 30
      COS_DECAY: 15

TEST:
  BATCH_SIZE: 4

